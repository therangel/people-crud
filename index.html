<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=close,delete,edit,group,home,left_panel_close,left_panel_open,menu,person_add,search,visibility" />

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">

    <title>Cadastro de Clientes</title>

</head>

<body>
    
    <div class="app"> 

        <div class="overlay"></div> 

        <aside class="sidebar">

            <div class="sidebar-header">

                <p class="logo-txt">Logo</p>

                <button class="close-sidebar btn">
                    <span class="material-symbols-outlined">close</span>
                </button>

                <button class="collapse-sidebar">
                    <span class="material-symbols-outlined">left_panel_close</span>
                </button>
            </div>

            <nav class="navigation">

                <a href="./" class="nav-link">
                    <span class="material-symbols-outlined home-page-icon nav-icon">home</span>

                    <span class="nav-label">Início</span>
                </a>

                <a href="./" class="nav-link">

                    <span class="material-symbols-outlined client-page-icon nav-icon">group</span>

                    <span class="nav-label">Clientes</span>   
                </a>
            </nav>
        </aside>

        <main class="main-content">    
            <header class="main-header">

                    <div class="header-group">
                        <button id="burger-btn" class="menu-button btn">
                            <span class="material-symbols-outlined">menu</span>
                        </button>
                        <h1 class="section-title">Clientes</h1>
                    </div>

                    <button class="add-client-button btn btn-primary">
                        <span class="material-symbols-outlined person-add-symbol">person_add</span>
                        <span class="add-button-text">Novo cliente</span>
                    </button>

                </header>

            <section class="clients-section">
            
                <div class="filters">

                    <div class="filter-options">

                        <div class="filter-group">
                            <label for="city-filter">Cidade</label>

                            <select id="city-filter" class="filter-select">
                                <option value="all">Todas</option>
                                <option value="Rio de Janeiro">Rio de Janeiro</option>
                                <option value="São Paulo">São Paulo</option>
                                <option value="Belo Horizonte">Belo Horizonte</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="status-filter">Status</label>
                            <select id="status-filter" class="filter-select">
                                <option value="all">Todos</option>
                                <option value="actives">Ativos</option>
                                <option value="inactives">Inativos</option>
                            </select>
                        </div>
    
                        <div class="filter-group">

                            <label for="sort-filter">Ordenar</label>
                            <select id="sort-filter" class="filter-select"> 
                                <option value="no-sort">Sem Ordenação</option>
                                <option value="name-a-z">Nome: A → Z</option>
                                <option value="name-z-a">Nome: Z → A</option>
                            </select>
                        </div>
                    </div>

                    <div class="applied-filters">
                        <p>Filtrar por: </p>

                        <div class="applied-filter-list">
                           
                        </div>

                        <button class="clear-filters-button">Limpar</button>
                    </div>
                </div>

                <div class="table-section">

                    <div class="table-section-header">

                        <div class="table-search-container">
                            <label for="table-search"></label>

                            <input type="text" id="table-search" class="table-search" placeholder="pesquisar cliente...">

                            <span class="material-symbols-outlined search-icon">
                                search
                            </span>
                        </div>
                        
                        <div class="filter-summary">
                            <p class="total-client">Clientes: 0</p>
                            <p class="total-active-client">Ativos: 0</p>
                        </div>
                    </div>

                    <div class="table-wrapper">

                        <table class="clients-table">
                            <thead>
                                <tr>
                                    <th>Id</th>
                                    <th>Nome</th>
                                    <th>Email</th>
                                    <th>Telefone</th>
                                    <th>Cidade</th>
                                    <th>Status</th>
                                    <th>Ações</th>                             
                                </tr>
                            </thead>
                            <tbody class="client-list"></tbody>
                        </table>
                    </div>  
                    
                     <div class="table-control">
                        <p>Mostrando 1 até 10 de 5</p>
                        <div class="table-control-buttons">
                            <button class="previous btn">Anterior</button>
                            <button class="next btn">Próximo</button>
                        </div>
                    </div>
                </div>

                <div class="modal-form">

                    <div class="modal-header">

                        <h2 class="modal-title">Dados</h2>
                        <button class="close-modal-button btn">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>

                    <form class="client-form">

                        <div class="form-field">
                            <label for="name">Nome: </label>
                            <input type="text" name="name" id="name" required placeholder="nome e sobrenome" maxlength="999">
                        </div>
                        <div class="form-field">
                            <label for="email">Email: </label>
                            <input type="email" name="email" id="email" min="18" autocomplete="email" required placeholder="seu@email.com" maxlength="99">
                        </div>
                        <div class="form-field">
                            <label for="phone">Telefone: </label>
                            <input type="tel" name="phone" id="phone" autocomplete="tel" inputmode="tel" required placeholder="(11) 98765-4321" maxlength="99">
                        </div>
                        <div class="form-field">
                            <label for="city">Cidade: </label>
                            <input type="text" name="city" id="city" required placeholder="cidade" maxlength="99">
                        </div>
                        
                        <div class="form-field">
                            <label for="status">Status: </label>
                            <input type="checkbox" name="status" id="status">
                        </div>

                        <button type="submit" class="form-submit-button btn btn-primary">Adicionar</button>
                    </form>
                </div>
            </section>
        </main>
        
    </div>
    

    <script src="js/main.js"></script>
    <script src="js/sidebar.js"></script>
</body>
</html>
