<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>Cadastro de Clientes</title>

</head>

<body>
    
    <div class="app"> 

        <div class="overlay"></div> 

        <aside class="sidebar">

            <div class="logo">
                <p>Logo</p>
            </div>

            <nav class="navigation">
                <a href="">Home</a>
                <a href="">Clientes</a>
            </nav>
        </aside>

        <button id="burger-btn" class="menu-button">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <main class="main-content">

            <section class="clients-section">

                <header class="page-header">

                    <h1>Clientes</h1>

                    <button class="add-client-button">
                        Novo cliente
                    </button>

                </header>
                
                <div class="filters">
                    
                    <div class="filter-options">

                        <div class="filter-group">

                            <label for="city-filter">Cidade</label>

                            <select id="city-filter" class="filter-select">
                                <option value="todas">Todas</option>
                                <option value="Rio de Janeiro">Rio de Janeiro</option>
                                <option value="São Paulo">São Paulo</option>
                                <option value="Belo Horizonte">Belo Horizonte</option>
                            </select>
                        </div>

                        <div class="filter-group">

                            <label for="profession-filter">Profissão</label>
                            <select id="profession-filter">
                                <option value="todas">Todas</option>
                                <option value="Desenvolvedor">Desenvolvedor</option>
                                <option value="Analista">Analista</option>
                                <option value="Designer">Designer</option>
                            </select>
                        </div>

                        <div class="filter-group">

                            <label for="active-filter">Ativos</label>
                            <input type="checkbox" id="active-filter">
                        </div>
    
                        <div class="filter-group">

                            <label for="sort-filter">Ordenar</label>
                            <select id="sort-filter">
                                <option value="sem-ordenacao">Sem Ordenação</option>
                                <option value="nome-a-z">Nome: A → Z</option>
                                <option value="nome-z-a">Nome: Z → A</option>
                                <option value="salario-menor">Salário: menor → maior</option>
                                <option value="salario-maior">Salário: maior → menor</option>
                            </select>
                        </div>
                    </div>

                    <div class="applied-filters">
                        <p>Filtrar por: </p>
                        <div class="applied-filter-list">

                        </div>
                        <button class="clear-filters-button">Limpar</button>
                    </div>


                    <div class="filter-summary">
                        <p class="total-people">Clientes: 0</p>
                        <p class="total-salaries">Salário total: R$0</p>
                        <p class="total-active-people">Ativos: 0</p>
                    </div>
                </div>

                <div class="modal-form">

                    <div class="modal-header">

                        <p>Dados</p>
                        <button class="close-modal-button">X</button>
                    </div>

                    <form class="person-form">

                        <div class="form-field">
                            <label for="name">Nome: </label>
                            <input type="text" name="name" id="name" required>
                        </div>
                        <div class="form-field">
                            <label for="age">Idade: </label>
                            <input type="text" name="age" id="age" min="18" required>
                        </div>
                        <div class="form-field">
                            <label for="city">Cidade: </label>
                            <input type="text" name="city" id="city" required>
                        </div>
                        <div class="form-field">
                            <label for="profession">Profissão: </label>
                            <input type="text" name="profession" id="profession" required>
                        </div>
                        <div class="form-field">
                            <label for="salary">Salário: </label>
                            <input type="number" name="salary" id="salary" min="0" required>
                        </div>
                        <div class="form-field">
                            <label for="active">Ativo: </label>
                            <input type="checkbox" name="active" id="active">
                        </div>

                        <button type="submit" class="form-submit-button">Adicionar</button>
                    </form>
                </div>

                <div class="table-section">
                    
                    <div class="table-wrapper">

                        <table class="clients-table">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Idade</th>
                                    <th>Cidade</th>
                                    <th>Profissão</th>
                                    <th>Salário</th>
                                    <th>Ativo</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody class="people-list"></tbody>
                        </table>
                    </div>  

                </div>
            </section>
        </main>
        
    </div>
    

    <script src="script.js"></script>
    <script src="sidebar.js"></script>
</body>
</html>
